<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <style>
    @font-face {
      font-family: 'SVN-Gotham';
      src: url('https://yourcdn.com/fonts/SVN-Gotham-Regular.woff2') format('woff2'),
           url('https://yourcdn.com/fonts/SVN-Gotham-Regular.woff') format('woff');
      font-weight: 400;
      font-style: normal;
    }

    @font-face {
      font-family: 'SVN-Gotham';
      src: url('https://drive.google.com/file/d/1klPgUXN-LadEyBdBqsK1g4zZI7Q7XKdD/view?usp=drive_link') format('woff2'),
           url('https://drive.google.com/file/d/1klPgUXN-LadEyBdBqsK1g4zZI7Q7XKdD/view?usp=drive_link') format('woff');
      font-weight: 700;
      font-style: normal;
    }
  </style>
  <title>Watsons Club</title>
</head>

<body style="margin:0;padding:0;background-color:#f4f4f4;">
  <table width="100%" cellpadding="0" cellspacing="0" style="background-color:#f4f4f4;">
    <tr>
      <td align="center">
        <!-- Container -->
        <table width="600" cellpadding="0" cellspacing="0" style="background-color:#ffffff;max-width:600px;width:100%;">
          
          <!-- Hero Image --> 
          <tr>
            <td>
              <img 
                src="./images/topvn.png"
                width="600"
                style="width:100%;max-width:600px;display:block;border:0;height:auto;"
                alt="Watsons Club"
              />
            </td>
          </tr>

          <!-- Content -->
          <tr>
            <td style="padding:24px;background-color:#ff4fb3;color:#ffffff;font-family:Arial,Helvetica,sans-serif;">
             <img 
                src="./images/text vn.png"
                width="600"
                style="width:100%;max-width:600px;display:block;border:0;height:auto;"
                alt="Watsons Club"
              />
            </td>
          </tr>

        </table>
        <img 
                src="./images/footervn.png"
                width="600"
                style="width:100%;max-width:600px;display:block;border:0;height:auto;"
                alt="Watsons Club"
              />
        <!-- End Container -->
      </td>
    </tr>
  </table>

  <style>
    @media only screen and (max-width: 600px) {
      table[width="600"] {
        width: 100% !important;
        max-width: 100% !important;
      }
      td {
        padding: 16px !important;
      }
      img {
        width: 100% !important;
        height: auto !important;
      }
      p {
        font-size: 14px !important;
      }
    }
  </style>
</body>
</html>
